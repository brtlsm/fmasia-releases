name: Qualify FMasia clean installers

on:
  workflow_dispatch:
    inputs:
      qualification_release_tag:
        description: Temporary draft release containing the sealed candidate and harness bundles
        required: true
        type: string
      candidate_id:
        description: Exact candidate identity
        required: true
        type: string

concurrency:
  group: clean-install-${{ inputs.candidate_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  installer:
    name: Clean ${{ matrix.installer }} install
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        installer: [msi, nsis]
    env:
      FMASIA_CLEAN_MACHINE_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.0
      - name: Download draft qualification bundles
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api 'repos/${{ github.repository }}/releases?per_page=100' | ConvertFrom-Json
          $release = @($releases | Where-Object { $_.draft -and $_.tag_name -eq '${{ inputs.qualification_release_tag }}' })
          if ($release.Count -ne 1) { throw 'Exact draft qualification release was not found.' }
          foreach ($name in @('target-candidate.zip', 'qualification-harness.zip')) {
            $asset = @($release[0].assets | Where-Object name -eq $name)
            if ($asset.Count -ne 1) { throw "Draft release lacks exact asset $name." }
            Invoke-WebRequest -Uri $asset[0].url -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            } -OutFile $name
          }
          Expand-Archive target-candidate.zip -DestinationPath target-candidate
          Expand-Archive qualification-harness.zip -DestinationPath qualification-harness
      - name: Verify exact candidate
        shell: pwsh
        run: |
          Push-Location qualification-harness
          try {
            node scripts/release-candidate.mjs verify --dir ../target-candidate --require-promotable
            if ($LASTEXITCODE -ne 0) { throw 'Candidate verification failed.' }
            $manifest = Get-Content -Raw ../target-candidate/candidate-manifest.json | ConvertFrom-Json
            if ($manifest.candidateId -ne '${{ inputs.candidate_id }}') { throw 'Candidate id mismatch.' }
          } finally { Pop-Location }
      - name: Exercise install, restart, reinstall and uninstall
        shell: pwsh
        run: |
          Push-Location qualification-harness
          try {
            & ./scripts/Test-WindowsInstaller.ps1 `
              -CandidateRoot (Resolve-Path ../target-candidate).Path `
              -InstallerKind '${{ matrix.installer }}' `
              -EvidenceOut (Join-Path (Resolve-Path ..).Path '${{ matrix.installer }}.json')
          } finally { Pop-Location }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fmasia-${{ matrix.installer }}-acceptance
          path: ${{ matrix.installer }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Seal clean-machine qualification
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.0
      - name: Download draft qualification bundles
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api 'repos/${{ github.repository }}/releases?per_page=100' | ConvertFrom-Json
          $release = @($releases | Where-Object { $_.draft -and $_.tag_name -eq '${{ inputs.qualification_release_tag }}' })
          if ($release.Count -ne 1) { throw 'Exact draft qualification release was not found.' }
          foreach ($name in @('target-candidate.zip', 'qualification-harness.zip')) {
            $asset = @($release[0].assets | Where-Object name -eq $name)
            if ($asset.Count -ne 1) { throw "Draft release lacks exact asset $name." }
            Invoke-WebRequest -Uri $asset[0].url -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            } -OutFile $name
          }
          Expand-Archive target-candidate.zip -DestinationPath target-candidate
          Expand-Archive qualification-harness.zip -DestinationPath qualification-harness
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fmasia-msi-acceptance
          path: acceptance/msi
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: fmasia-nsis-acceptance
          path: acceptance/nsis
      - name: Seal and verify both installer paths
        shell: pwsh
        run: |
          Push-Location qualification-harness
          try {
            node scripts/check-clean-machine-qualification.mjs build `
              --candidate ../target-candidate `
              --msi-evidence ../acceptance/msi/msi.json `
              --nsis-evidence ../acceptance/nsis/nsis.json `
              --out ../clean-machine-qualification
            node scripts/check-clean-machine-qualification.mjs verify `
              --candidate ../target-candidate `
              --qualification ../clean-machine-qualification
          } finally { Pop-Location }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fmasia-clean-machine-qualification
          path: clean-machine-qualification
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
